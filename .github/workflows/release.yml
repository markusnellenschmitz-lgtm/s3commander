name: Release

# Ein Tag wie v0.2.0 legt einen Release-Entwurf an und baut dafür Installer und portable EXE für
# Windows sowie AppImage und .deb für Linux.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Release-Entwurf anlegen
    needs: checks
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag gegen App-Version prüfen
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} passt nicht zur Version $version in tauri.conf.json" >&2
            exit 1
          fi

      - name: Entwurf anlegen
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            **Windows**
            - Installer (empfohlen): `S3 Commander_*_x64-setup.exe`
            - Portable EXE ohne Installation: `S3-Commander_*_x64-portable.exe` (braucht WebView2, unter Windows 11 vorhanden)

            Die Windows-Dateien sind nicht code-signiert; SmartScreen fragt deshalb beim ersten Start nach
            („Weitere Informationen › Trotzdem ausführen“).

            **Linux** (x86_64)
            - Debian, Ubuntu, Mint: `S3 Commander_*_amd64.deb`
            - Andere Distributionen: `S3 Commander_*_amd64.AppImage` (ausführbar machen und starten)

            Zugangsdaten liegen unter Linux im Schlüsselbund (Secret Service, etwa GNOME Keyring oder KWallet).
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="${{ github.ref_name }}" \
            -f name="S3 Commander ${{ github.ref_name }}" \
            -f body="$BODY" \
            -F draft=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen und an den Entwurf hängen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}

      - name: Portable EXE anhängen
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $portable = "S3-Commander_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/s3-commander.exe $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber
