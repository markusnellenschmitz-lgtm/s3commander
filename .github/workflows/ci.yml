name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint und Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux-Pakete für Tauri und den Schlüsselbund
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev patchelf gnome-keyring dbus-x11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Frontend – Lint
        run: npm run lint

      - name: Frontend – Formatierung
        run: npm run format:check

      - name: Frontend – Tests mit Abdeckung
        run: npm run test:coverage

      - name: Backend – Formatierung
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Backend – Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Backend – Tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --locked

      # Die Tests der Zugangsdaten brauchen einen entsperrten Schlüsselbund mit Secret Service.
      - name: Backend – Tests (mit GNOME Keyring)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --components=secrets --daemonize --unlock > /dev/null
            cargo test --locked
          '
